# M1：GitHub Actions CI（蓝图 v20 内容钉死；对应里程碑"Py3.11，pytest+tsc -b，锁定依赖"）
# 后端 29 项单测不需要 DB 与 API key（tests/conftest.py 仅注入 sys.path）；
# 前端 npm ci 依赖已提交的 package-lock.json；tsc -b 在 npm run build 内执行。
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - name: pytest
        working-directory: backend
        run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci + build (tsc -b)
        working-directory: frontend
        run: |
          npm ci
          npm run build
